# =============================================================================
# Try Build — manual full-matrix build check, publishes nothing.
#
# Runs in pandev-metriks/pandev-cli. Use it to verify that an arbitrary GitLab
# branch builds on every platform before merging it anywhere — the successor
# of the old PR Check (unit tests themselves now run in GitLab CI on MRs).
# =============================================================================
name: Try Build
run-name: "Try · ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "GitLab branch to build"
        required: true
        default: "dev"

permissions:
  contents: read

env:
  GITLAB_REPO: git.pandev.io/pandev/metrics/plugins/pandev-metrics-cli.git
  SRC_REF: ${{ inputs.ref }}

jobs:
  tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - name: Checkout source from GitLab
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 100 --branch "$SRC_REF" "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}" .
          git log -1 --oneline

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Windows-раннер не содержит sqlite3, и без этого шага тесты
      # SQLite-воркеров (ZCode/opencode/Kilo) там молча пропускаются.
      - name: Provision sqlite3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/smoke/install-sqlite3-windows.ps1

      # Флаг в кавычках обязателен: на Windows шаг исполняется pwsh, который
      # разбирает незакавыченный -Dpandev.tests.requireSqlite3=true на два
      # аргумента, и maven получает фазу «.tests.requireSqlite3=true».
      - name: Run tests
        run: mvn -B -ntp test "-Dpandev.tests.requireSqlite3=true"

      - name: Gate — no skipped tests
        if: always()
        shell: bash
        run: sh ci/smoke/assert-no-skipped-tests.sh

  package:
    name: Package (${{ matrix.os }} - ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: linux
          - os: macos-15
            profile: macos
          - os: macos-15-intel
            profile: macos
          - os: windows-latest
            profile: windows
    steps:
      - name: Checkout source from GitLab
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 100 --branch "$SRC_REF" "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}" .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package profile
        run: mvn -B -ntp -DskipTests package "-P${{ matrix.profile }}"

      # Сквозная проверка на собранном jar: синтетический журнал с известным
      # расходом → cost --json → сверка чисел. В релизных workflow тот же
      # скрипт гоняется по артефакту с его jlink-рантаймом; здесь — по jar,
      # чтобы сама приёмка проверялась на каждом try-build, а не только при
      # выпуске.
      - name: E2E — cost on a synthetic log
        if: runner.os != 'Windows'
        run: sh ci/smoke/e2e-cost.sh java -jar target/pandev-myapp.jar

      - name: E2E — cost on a synthetic log
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/smoke/e2e-cost.ps1 java -jar target/pandev-myapp.jar

  # Автообновление на Windows (PDM-5483): установленный пакет с работающим
  # вотчером обновляется задачей Планировщика вне пакета, как у клиента. Сборка
  # MSIX подписывается одноразовым сертификатом, вторая версия пакуется из того
  # же app-image; GitHub поддельный — манифест подписан ключом теста.
  msix-update:
    name: MSIX update (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout source from GitLab
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 100 --branch "$SRC_REF" "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}" .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build MSIX
        shell: pwsh
        run: mvn -q -ntp clean package -DskipTests -Pwindows-installer-msix

      - name: Sign MSIX (throwaway certificate)
        shell: pwsh
        run: |
          $msix = Get-ChildItem 'target\installer-msix\pandev-*.msix' | Select-Object -First 1
          if (-not $msix) { throw 'No MSIX produced by maven build.' }
          ./build/windows-msix/sign-msix.ps1 -MsixPath $msix.FullName -SelfSigned

      - name: Smoke — update a running install outside the package
        shell: powershell
        run: |
          $msix = Get-ChildItem 'target\installer-msix\pandev-*.msix' | Select-Object -First 1
          ./ci/smoke/msix-update.ps1 -OldMsix $msix.FullName
